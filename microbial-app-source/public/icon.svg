<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdfa" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Agar Petri Plate Ring -->
  <circle cx="256" cy="256" r="176" fill="url(#plate)" stroke="#ccfbf1" stroke-width="12" />
  <circle cx="256" cy="256" r="148" fill="#f8fafc" stroke="#99f6e4" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Microbial Colonies (CFU Dots) -->
  <circle cx="210" cy="220" r="18" fill="#ef4444" opacity="0.9" />
  <circle cx="290" cy="200" r="14" fill="#f59e0b" opacity="0.9" />
  <circle cx="280" cy="270" r="22" fill="#ef4444" opacity="0.9" />
  <circle cx="220" cy="290" r="16" fill="#10b981" opacity="0.9" />
  <circle cx="320" cy="250" r="12" fill="#0d9488" opacity="0.9" />
  <circle cx="190" cy="255" r="10" fill="#f59e0b" opacity="0.9" />

  <!-- Cleanroom Glove Hand Print Subtle Outline -->
  <path d="M220 340 C 220 320, 240 310, 256 310 C 272 310, 292 320, 292 340 Z" fill="#0d9488" opacity="0.15" />

  <!-- Checkmark Badge -->
  <circle cx="370" cy="370" r="64" fill="#059669" stroke="#ffffff" stroke-width="8" />
  <path d="M344 370 L362 388 L398 352" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
